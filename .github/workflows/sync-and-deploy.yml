name: Sync Drive manifest and deploy brand kit

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — adjust to taste
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install sync dependencies
        working-directory: sync
        run: npm install

      - name: Pull latest manifest from Drive
        working-directory: sync
        env:
          DRIVE_ROOT_FOLDER_ID: ${{ secrets.DRIVE_ROOT_FOLDER_ID }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
        run: npm run sync

      - name: Commit updated manifest (if changed)
        run: |
          git config user.name "brand-kit-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/data/manifest.json
          git diff --cached --quiet || git commit -m "Sync brand kit manifest from Drive"
          git push

